<style>
@font-face{font-family:'Fraunces';font-weight:500;font-display:swap;src:url(fonts/fraunces-500.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-weight:600;font-display:swap;src:url(fonts/fraunces-600.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-display:swap;src:url(fonts/dm-sans-400.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-display:swap;src:url(fonts/dm-sans-500.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:600;font-display:swap;src:url(fonts/dm-sans-600.woff2) format('woff2')}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f7;--card:#fff;--field:#f7f8f9;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--brand:#0f6cbd;--tint:#eaf3fc;--pb:#16181d;--pt:#fff;--g:#5cc796;--gi:#0d4029;--r:#f2807a;--ri:#521410;--y:#f6d365;--yi:#5b4300;--n:#dfe2e6;--danger:#c62828;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#181b20;--field:#13161a;--ink:#eceef1;--mute:#9aa3b0;--line:#2a2f37;--brand:#6cb4f0;--tint:#18232f;--pb:#eceef1;--pt:#111318;--g:#3fae7f;--gi:#04160e;--r:#e2645e;--ri:#2b0605;--y:#e0b93f;--yi:#2b2100;--n:#333a44;--danger:#f2867f;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#181b20;--field:#13161a;--ink:#eceef1;--mute:#9aa3b0;--line:#2a2f37;--brand:#6cb4f0;--tint:#18232f;--pb:#eceef1;--pt:#111318;--g:#3fae7f;--gi:#04160e;--r:#e2645e;--ri:#2b0605;--y:#e0b93f;--yi:#2b2100;--n:#333a44;--danger:#f2867f;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;padding:22px 16px 56px}
h1,h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.12rem}
.sub{color:var(--mute);font-size:.92rem;margin:4px 0 0}
.eyebrow{margin:0 0 4px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.who{min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.center{max-width:400px;margin:8vh auto 0}
label{display:block;font-size:.84rem;font-weight:500;color:var(--mute);margin:16px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;transition:transform .06s,opacity .15s}
button:active{transform:scale(.97)}
button.p{background:var(--pb);color:var(--pt);border-color:transparent;font-weight:600}
button.del{border:0;background:none;color:var(--danger);padding:6px 4px;font-size:.86rem}
button.l{border:0;background:none;color:var(--mute);padding:4px 0;text-decoration:underline}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.chips button{padding:6px 14px;font-size:.86rem;border-radius:999px;color:var(--mute)}
.today{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--tint);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:26px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;padding:16px 18px}
.item:hover{border-color:var(--brand)}
.err{color:var(--danger);font-size:.86rem;margin:10px 0 0}
.msg{background:var(--tint);border-radius:12px;padding:10px 14px;font-size:.9rem;margin:10px 0 0}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--mute);margin:0 0 12px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;font-size:.82rem}
th,td{padding:0;text-align:center;border-bottom:1px solid var(--line);min-width:38px}
tbody tr:last-child td{border-bottom:0}
th{font-weight:600;padding:8px 0 6px;cursor:pointer;color:var(--mute);line-height:1.2}
th.td,td.tc{background:var(--tint)}
th.td{color:var(--brand)}
th.h{background:var(--y);color:var(--yi)}
.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:10px 12px;min-width:124px;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1;border-right:1px solid var(--line);cursor:default;font-weight:500}
th.nm,th.t{color:var(--ink);cursor:default}
td.t{padding:0 12px;color:var(--mute);font-variant-numeric:tabular-nums}
.c{display:block;width:30px;height:30px;margin:4px auto;border-radius:9px;border:1.5px dashed var(--line);background:none;padding:0;font-weight:700;font-size:.78rem;color:inherit}
.c.P{background:var(--g);color:var(--gi);border:0}
.c.A{background:var(--r);color:var(--ri);border:0}
.c.H{background:var(--y);color:var(--yi);border:0;cursor:default}
.c.N{background:repeating-linear-gradient(135deg,var(--n) 0 3px,transparent 3px 7px);border:0;cursor:default}
.hn{display:block;writing-mode:vertical-rl;transform:rotate(180deg);max-height:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto 2px;font-size:.74rem;font-weight:600}
.tnav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pop .tnav button{width:auto;margin:0;padding:4px 14px;font-size:1.2rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal b{font-size:.72rem;color:var(--mute);text-align:center;font-weight:600}
.pop .cd{margin:0;width:100%;aspect-ratio:1;padding:0;border-radius:10px;font-weight:600;font-size:.9rem;background:var(--field)}
.pop .cd.P{background:var(--g);color:var(--gi);border-color:transparent}
.pop .cd.A{background:var(--r);color:var(--ri);border-color:transparent}
.pop .cd.H{background:var(--y);color:var(--yi);border-color:transparent}
.pop .cd.N,.pop .cd.F{color:var(--mute);opacity:.55}
.pop .cd.now{outline:2px solid var(--brand);outline-offset:1px}
.pair{display:flex;gap:8px}.pair select{flex:1;min-width:0}
.bar{display:flex;gap:8px;margin:14px 0 0;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 6px 24px rgba(16,24,40,.16)}
.bar select{width:auto;flex:1;min-width:0}
.pin{letter-spacing:.4em;text-align:center}
.lg{font-size:1.6rem;max-width:200px;margin:16px auto 0;display:block}
.logo{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;box-shadow:0 2px 14px rgba(16,24,40,.16)}
.logo.s{width:52px;height:52px;margin:0;flex:none}
.pop{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.pop .box{width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.pop button{width:100%;margin-top:8px}
@media (min-width:600px){.pop{align-items:center;padding:16px}.pop .box{border-radius:20px}}
</style>
</head>

  if(dlg.k==='ta')return taHTML();
  const d=dlg.d;let b='';
  if(dlg.k==='day')b=`<h2>Day ${d}</h2>`+(m.sub[d]?`<p class="sub">Attendance is submitted and locked.</p>`:!canHol(m,d)?`<p class="sub">This day is closed. Past days cannot be changed.</p>`:
    `<button data-a="hol0">${m.h[d]?'Edit holiday':'Mark as holiday / Sunday'}</button>${m.h[d]||canMark(m,d)?'':'<p class="sub">Attendance for this day can be marked when the day arrives.</p>'}`);
  else if(dlg.k==='hol')b=`<h2>Name this holiday (day ${d})</h2><input id="hn" data-enter="hsave" placeholder="e.g. Sunday, Eid, Winter break" value="${m.h[d]&&m.h[d]!==true?esc(m.h[d]):''}"><button class="p" data-a="hsave">Save holiday</button>${m.h[d]?'<button data-a="hrem">Remove holiday</button>':''}`;
  else if(dlg.k==='st'){const ls=lastSub(m),def=Math.min(Math.max(sel,ls+1),m.days);let o='';for(let x=ls+1;x<=m.days;x++)o+=`<option value="${x}"${x===def?' selected':''}>Day ${x}</option>`;
    b=`<h2>Add student</h2><label for="sn" style="margin-top:0">Student name</label><input id="sn" data-enter="stsave" autocomplete="off"><label for="sj">Joining day (earlier days stay gray)</label><select id="sj">${o}</select>${err?`<p class="err">${err}</p>`:''}<button class="p" data-a="stsave">Add student</button>`}
  else b=`<h2>Delete month?</h2><p class="sub">All its attendance will be removed. Enter your PIN.</p>${PIN('dp','delok')}${err?`<p class="err">${err}</p>`:''}<button class="p" data-a="delok">Delete</button>`;
  return `<div class="pop" data-a="close"><div class="box">${b}<button data-a="close">Cancel</button></div></div>`;
}
function draw(){
  if(!S.t||!S.pin){
    A.innerHTML=`<div class="box center"><div style="text-align:center"><img class="logo" src="${LOGO}" alt="RollCall logo"><p class="eyebrow" style="margin-top:16px">RollCall Attendance App</p><h1>Welcome, let's get you set up</h1><p class="sub">Set up your teacher account: a name and a 4-digit PIN.</p></div>
    <label for="nm">Teacher name</label><input id="nm" value="${esc(pd.n||S.t)}" autocomplete="name">
    <label for="p1">Create a 4-digit PIN</label>${PIN('p1')}
    <label for="p2">Confirm PIN</label>${PIN('p2','setup')}
    ${err?`<p class="err">${err}</p>`:''}<div class="row"><button class="p" data-a="setup">Save and continue</button></div></div>`;
    return}
  if(locked){
    A.innerHTML=`<div class="box center" style="text-align:center"><img class="logo" src="${S.dp||LOGO}" alt=""><h1 style="margin-top:16px">Welcome back, ${esc(S.t)}</h1><p class="sub">Enter your PIN to unlock.</p>${PIN('lp','','lg')}${err?`<p class="err">${err}</p>`:''}</div>`;
    return}
  if(view==='prof'){
    A.innerHTML=`<div class="top"><div><h1>Teacher profile</h1><p class="sub">Your current PIN is needed to save any change.</p></div><button data-a="home">Back</button></div>
    <div class="box"><img class="logo" src="${pd.dp||S.dp||LOGO}" alt="Profile photo"><div class="row" style="justify-content:center;margin-top:10px"><button data-a="pickdp">Change photo</button></div><input id="dpf" type="file" accept="image/*" hidden>
    <label for="pn">Name</label><input id="pn" value="${esc(pd.n)}">
    <label for="pp1">New PIN (leave empty to keep the same)</label>${PIN('pp1')}
    <label for="pp2">Confirm new PIN</label>${PIN('pp2')}
    <label for="pcp">Current PIN (required)</label>${PIN('pcp','saveprof')}
    ${err?`<p class="err">${err}</p>`:''}${msg?`<p class="msg">${msg}</p>`:''}
    <div class="row"><button class="p" data-a="saveprof">Save changes</button></div></div>`;
    return}
  if(view==='new'){
    A.innerHTML=`<div class="top"><div><h1>New month</h1><p class="sub">Create a fresh attendance calendar.</p></div><button data-a="home">Cancel</button></div>
    <div class="box"><label for="mm" style="margin-top:0">Month and year (dates follow your phone's calendar)</label><div class="pair"><select id="mm">${MN.map((x,i)=>`<option value="${i+1}"${i+1==draft.mm?' selected':''}>${x}</option>`).join('')}</select><input id="my" type="number" min="2000" max="2100" value="${draft.my}" style="width:96px;flex:none"></div><label for="mn">Month name</label><input id="mn" placeholder="e.g. October 2026" value="${esc(draft.n)}">
    <label for="md">Number of days</label><input id="md" type="number" min="1" max="31" value="${esc(draft.d)}">
    <label for="ms">Student names (one per line or separated by commas)</label><textarea id="ms" rows="7" placeholder="Ali Khan&#10;Sara Ahmed">${esc(draft.s)}</textarea>
    ${err?`<p class="err">${err}</p>`:''}
    <div class="row"><button class="p" data-a="create">Create calendar</button></div></div>`;
    return}
  if(view==='month'&&M()){
    const m=M(),days=[...Array(m.days)].map((_,i)=>i+1),bd=days.filter(d=>bad(m,d));
    const hl=Object.keys(m.h).sort((a,b)=>a-b).map(d=>`${d}: ${esc(hname(m.h[d]))}`).join(', ');
    A.innerHTML=`<div class="top"><div><h1>${esc(m.name)}</h1><p class="sub">Tap a cell: present, absent, then holiday. Submitted days are final.</p></div><button data-a="home">Back</button></div>
    <div class="leg"><span><i style="background:var(--g)"></i>Present</span><span><i style="background:var(--r)"></i>Absent</span><span><i style="background:var(--y)"></i>Holiday</span><span>✓ Submitted</span><span><i style="background:var(--n)"></i>Not admitted yet</span></div>
    <div class="wrap"><table><thead><tr><th class="nm">Student</th>${days.map(d=>`<th data-a="day" data-d="${d}" class="${m.h[d]?'h':''}${m.start&&todayN(m)===d?' td':''}" style="${d===sel?'color:var(--ink);text-decoration:underline':''}">${m.h[d]?`<span class="hn">${esc(hname(m.h[d]))}</span>`:d}${bad(m,d)?'⚠':m.sub[d]?'✓':''}${m.start?`<small style="display:block;font-weight:400">${'SMTWTFS'[fmtD(m,d).getDay()]}</small>`:''}</th>`).join('')}<th class="t">P</th><th class="t">A</th></tr></thead><tbody>
    ${m.s.map((s,i)=>{let p=0,a=0;const cells=days.map(d=>{const v=d<(s.j||1)?'N':m.h[d]?'H':s.a[d]||'';if(m.sub[d]){if(v==='P')p++;if(v==='A')a++}return `<td class="${m.start&&todayN(m)===d?'tc':''}"><button class="c ${v}" data-a="cell" data-i="${i}" data-d="${d}" aria-label="${esc(s.n)}, day ${d}">${v==='H'||v==='N'?'':v}</button></td>`}).join('');
    return `<tr><td class="nm" title="${s.j>1?'Joined on day '+s.j:''}">${esc(s.n)}</td>${cells}<td class="t">${p}</td><td class="t">${a}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="sub" style="margin-top:8px">Totals count submitted days only.${hl?` Holidays - ${hl}.`:''}</p>
    <div class="row" style="margin-top:10px"><button data-a="addst">Add student</button></div>
    ${bd.length?`<p class="err">⚠ Records for day ${bd.join(', ')} were changed outside the app.</p>`:''}
    ${dayInfo(m)}<div class="bar"><select id="sel" aria-label="Day">${days.map(d=>`<option value="${d}"${d===sel?' selected':''}>Day ${d}${m.h[d]?' - '+esc(hname(m.h[d])):m.sub[d]?' ✓ submitted':''}</option>`).join('')}</select>
    <button class="p" data-a="submit"${m.sub[sel]?(m.ed[sel]||!canMark(m,sel)?' disabled':''):(m.h[sel]||!canMark(m,sel)?' disabled':'')}>${m.sub[sel]?(m.ed[sel]||!canMark(m,sel)?'Submitted':conf===sel?'Confirm edit':'Edit once'):m.h[sel]?'Holiday':!canMark(m,sel)?'Not today':conf===sel?'Confirm submit':'Submit attendance'}</button></div>
    ${msg?`<p class="msg">${msg}</p>`:''}${dlgHTML(m)}`;
    return}
  const now=new Date(),hr=now.getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening',tm=todayMonth(),tn=tm?todayN(tm):0;
  let card='';
  if(tm){const act=tm.s.filter(s=>(s.j||1)<=tn),mk=act.filter(s=>s.a[tn]).length;
    const st=tm.h[tn]?`Holiday: ${esc(hname(tm.h[tn]))}`:tm.sub[tn]?'Submitted. All done for today.':`${mk} of ${act.length} students marked`;
    card=`<div class="today"><div><p class="eyebrow">Today's attendance</p><h2>${esc(tm.name)}, day ${tn}</h2><p class="sub">${st}</p></div><button class="p" data-a="open" data-id="${tm.id}">${tm.sub[tn]||tm.h[tn]?'View':'Take attendance'}</button></div>`}
  A.innerHTML=`<div class="hd"><img class="logo s" src="${S.dp||LOGO}" alt=""><div class="who"><p class="eyebrow">RollCall Attendance App</p><h1>${gr}, ${esc(S.t)}</h1><p class="sub">${now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div></div>
  <div class="chips"><button data-a="prof">Profile</button><button data-a="myatt">My attendance</button><button data-a="theme">${isDark()?'Light mode':'Dark mode'}</button></div>${card}
  <div class="sec"><h2>Your months</h2><button class="p" data-a="new">New month</button></div>
  ${S.m.length?S.m.slice().reverse().map(m=>`<div class="box item" data-a="open" data-id="${m.id}"><div><h2>${esc(m.name)}</h2><p class="sub">${m.days} days · ${m.s.length} students · ${Object.keys(m.sub).length} submitted</p></div>
  <button class="del" data-a="del" data-id="${m.id}">Delete</button></div>`).join(''):
  `<div class="box"><h2>Nothing here yet</h2><p class="sub">Create this month's register to start taking attendance.</p></div>`}${dlgHTML(null)}`;
}
const readProf=()=>{pd.n=$('pn').value;pd.np=$('pp1').value;pd.nc=$('pp2').value;pd.cp=$('pcp').value};
A.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,m=M();
  if(a==='close'&&e.target!==t&&!t.matches('button'))return;
  msg='';err='';if(a!=='submit')conf=0;
  const D=dlg&&dlg.d;
  if(a==='pickdp'){$('dpf').click();return}
  if(a==='setup'){const n=$('nm').value.trim(),p1=$('p1').value,p2=$('p2').value;pd.n=n;
    if(!n)err='Please enter your name.';else if(!/^\d{4}$/.test(p1))err='PIN must be exactly 4 digits.';else if(p1!==p2)err='The two PINs do not match.';
    else{S.t=n;S.pin=h(S.salt+p1);S.since=todayISO();locked=false;view='home';save()}}
  else if(a==='theme'){S.theme=isDark()?'light':'dark';applyTheme();save()}
  else if(a==='myatt'){const n=new Date();dlg={k:'ta',y:n.getFullYear(),mo:n.getMonth()}}
  else if(a==='tprev'||a==='tnext'){const x=new Date(dlg.y,dlg.mo+(a==='tnext'?1:-1),1);dlg.y=x.getFullYear();dlg.mo=x.getMonth()}
  else if(a==='tday'){const dt=t.dataset.dt,st=tstat(dt);if(st==='T'){S.ta[dt]=tsig(dt);save();msg='Marked present. Have a great day!'}else msg={P:'Already marked present.',A:'Past days can no longer be changed.',F:'You can only mark today.',H:'Holiday: no attendance needed.',N:'That was before you started using the app.'}[st]}
  else if(a==='prof'){view='prof';pd={n:S.t,dp:null,np:'',nc:'',cp:''}}
  else if(a==='saveprof'){readProf();const n=pd.n.trim();
    if(!chk(pd.cp))err='Current PIN is incorrect.';
    else if(!n)err='Name cannot be empty.';
    else if((pd.np||pd.nc)&&!/^\d{4}$/.test(pd.np))err='New PIN must be exactly 4 digits.';
    else if(pd.np!==pd.nc)err='The new PINs do not match.';
    else{let ch=false;if(n!==S.t){S.t=n;ch=true}if(pd.np){S.pin=h(S.salt+pd.np);ch=true}if(pd.dp&&pd.dp!==S.dp){S.dp=pd.dp;ch=true}
      if(ch)save();msg=ch?'Profile updated.':'Nothing to change.';pd={n:S.t,dp:null,np:'',nc:'',cp:''}}}
  else if(a==='home'){view='home';dlg=null}
  else if(a==='new'){view='new';draft=newDraft()}
  else if(a==='create'){
    const n=$('mn').value.trim(),d=parseInt($('md').value,10),my=+$('my').value,mm=+$('mm').value,
      st=$('ms').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
    if(!n||!(d>=1&&d<=31)||!st.length||!(my>=2000&&my<=2100)){draft={n,d:$('md').value,s:$('ms').value,mm,my,ot:true};err='Enter a month name, a valid year, days between 1 and 31, and at least one student.';return render()}
    const id='m'+Date.now();S.m.push({id,name:n,days:d,h:{},sub:{},sig:{},ed:{},op:{},start:my+'-'+String(mm).padStart(2,'0')+'-01',ot:true,s:st.map(x=>({n:x,a:{}}))});save();cur=id;view='month';sel=startSel(M())}
  else if(a==='open'){cur=t.dataset.id;view='month';sel=startSel(M());jump=true}
  else if(a==='del'){dlg={k:'del',id:t.dataset.id}}
  else if(a==='delok'){if(!chk($('dp').value))err='Incorrect PIN.';else{S.m=S.m.filter(x=>x.id!==dlg.id);dlg=null;save()}}
  else if(a==='addst'){if(lastSub(m)>=m.days)msg='All days are submitted. Add new students in the next month.';else dlg={k:'st'}}
  else if(a==='stsave'){const n=$('sn').value.trim(),j=+$('sj').value;
    if(!n)err='Enter the student name.';else if(j<=lastSub(m))err='Joining day must be after the last submitted day.';
    else{m.s.push({n,a:{},j});save();msg=`${esc(n)} added from day ${j}.`;dlg=null}}
  else if(a==='day'){dlg={k:'day',d:+t.dataset.d};sel=dlg.d}
  else if(a==='close'){dlg=null}
  else if(a==='hol0'){dlg={k:'hol',d:D}}
  else if(a==='hsave'){if(!m.sub[D]&&canHol(m,D)){m.h[D]=$('hn').value.trim()||'Holiday';if(dlg.i!=null)delete m.s[dlg.i].a[D];save()}dlg=null}
  else if(a==='hrem'){if(!m.sub[D]&&canHol(m,D))delete m.h[D];save();dlg=null}
  else if(a==='submit'){
    if(m.h[sel])msg=`Day ${sel} is a holiday.`;
    else if(m.sub[sel]){
      if(m.ed[sel]||!canMark(m,sel))msg=`Day ${sel} is submitted and locked.`;
      else if(conf!==sel){conf=sel;msg='A day can be edited only once. After editing, submit it again to lock it. Tap Confirm edit to continue.'}
      else{delete m.sub[sel];delete m.sig[sel];m.ed[sel]=true;m.op[sel]=true;conf=0;msg='Edit mode. Change the attendance, then submit again.'}}
    else if(!canMark(m,sel))msg=`You can only submit today's attendance (day ${todayN(m)}).`;
    else{const n=m.s.filter(s=>(s.j||1)<=sel&&!s.a[sel]).length;
      if(n)msg=`${n} student${n>1?'s are':' is'} not marked for day ${sel}.`;
      else if(conf!==sel){conf=sel;msg=`Submitting day ${sel} is final and cannot be edited. Tap Confirm submit to continue.`}
      else{m.sub[sel]=true;m.sig[sel]=sig(m,sel);delete m.op[sel];conf=0;msg=`Day ${sel} attendance submitted and locked.`;sel=onlyToday(m)?sel:nextDay(m,sel+1);jump=true}}
    save()}
  else if(a==='cell'){
    const d=+t.dataset.d,i=+t.dataset.i;sel=d;
    if(d<(m.s[i].j||1))msg=`${esc(m.s[i].n)} joined on day ${m.s[i].j}, so this day stays blank.`;
    else if(m.sub[d])msg=canMark(m,d)&&!m.ed[d]?`Day ${d} is submitted. Use Edit once if you need to change it.`:`Day ${d} is submitted and locked.`;
    else if(m.h[d]){if(canHol(m,d))dlg={k:'hol',d};else msg='This holiday is in the past and cannot be changed.'}
    else if(!canMark(m,d))msg=`Attendance can only be marked for today (day ${todayN(m)}).`;
    else{const s=m.s[i],v=s.a[d];
      if(!v){s.a[d]='P';save()}else if(v==='P'){s.a[d]='A';save()}else dlg={k:'hol',d,i}}}
  render();
});
A.addEventListener('change',e=>{const t=e.target;
  if(t.id==='mm'||t.id==='my'){const y=+$('my').value,mo=+$('mm').value;if(y>=2000&&y<=2100){$('mn').value=MN[mo-1]+' '+y;$('md').value=new Date(y,mo,0).getDate()}}
  else if(t.id==='sel'){sel=+t.value;msg='';conf=0;jump=true;render()}
  else if(t.id==='dpf'&&t.files[0]){readProf();const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);pd.dp=c.toDataURL('image/jpeg',.8);render()};im.src=fr.result};
    fr.readAsDataURL(t.files[0])}});
A.addEventListener('input',e=>{const t=e.target;
  if(t.classList.contains('pin'))t.value=t.value.replace(/\D/g,'').slice(0,4);
  if(t.id==='lp'&&t.value.length===4){
    if(Date.now()<until)err=`Too many attempts. Wait ${Math.ceil((until-Date.now())/1000)} seconds.`;
    else if(chk(t.value)){locked=false;fails=0;err='';openToday()}
    else{fails++;err='Wrong PIN. Try again.';if(fails>=5){fails=0;until=Date.now()+30000;err='Too many attempts. Wait 30 seconds.'}}
    render()}});
A.addEventListener('keydown',e=>{const en=e.target.dataset&&e.target.dataset.enter;
  if(e.key==='Enter'&&en){const b=A.querySelector('[data-a='+en+']');if(b)b.click()}});
window.appLock=()=>{if(S.pin&&!locked){locked=true;err='';render()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pin&&!locked){locked=true;err='';render()}});
let lastDay=new Date().toDateString();
setInterval(()=>{const n=new Date().toDateString();if(n!==lastDay){lastDay=n;finalize();if(dlg&&dlg.k==='ta'){const z=new Date();dlg.y=z.getFullYear();dlg.mo=z.getMonth()}const m=M();if(m&&view==='month'&&!locked){sel=startSel(m);jump=true}render()}},30000);
finalize();
render();
</script>
